<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Single-user tech-demo pipeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 1164px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Single-user tech-demo pipeline</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1164 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tech-demo-pipeline-title tech-demo-pipeline-desc">
        <title id="tech-demo-pipeline-title">Single-user tech-demo pipeline</title>
        <desc id="tech-demo-pipeline-desc">Architecture diagram showing a public X bookmark reaching the Cursor cloud agent, which installs and runs the real tool inside the sticky monorepo sandbox, produces a self-contained HTML artifact, and opens a pull request with screenshot and video proof.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: work that happens inside the sticky monorepo / cloud sandbox (drawn before arrows and nodes) -->
        <rect x="192" y="56" width="756" height="144" rx="8"
              fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="528" y="60" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="570" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">AGENT WORKSPACE</text>

        <!-- Arrows first (behind boxes) -->
        <!-- 1: Owner -> Monorepo -->
        <line x1="160" y1="136" x2="208" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2: Monorepo -> Cloud Agent -->
        <line x1="348" y1="136" x2="396" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3: Cloud Agent -> Real Tool -->
        <line x1="556" y1="136" x2="604" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4: Real Tool -> HTML Artifact -->
        <line x1="744" y1="136" x2="792" y2="136" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- 5 (accent / headline): Cloud Agent -> Pull Request, routed below the row to avoid transiting Real Tool / HTML Artifact -->
        <path d="M 476,184 V 216 Q 476,224 484,224 H 1044 Q 1052,224 1052,216 V 184"
              fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- 6 (dashed / secondary): HTML Artifact -> Pull Request, evidence attached to the PR -->
        <line x1="932" y1="136" x2="980" y2="136" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="168" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="184" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POSTS</text>

        <rect x="356" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="372" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PICKS</text>

        <rect x="566" y="116" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="580" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUNS</text>

        <rect x="752" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="768" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD</text>

        <rect x="940" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/>
        <text x="956" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LINKS</text>

        <rect x="732" y="204" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="764" y="213" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPENS PR</text>

        <!-- Node 1: Repo Owner (input) -->
        <rect x="40" y="88" width="120" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="88" width="120" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <rect x="48" y="94" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
        <text x="64" y="103" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRC</text>
        <text x="100" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Repo Owner</text>
        <text x="100" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">public X bookmark</text>

        <!-- Node 2: Sticky Monorepo (store) -->
        <rect x="208" y="88" width="140" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="208" y="88" width="140" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="216" y="94" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="234" y="103" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REPO</text>
        <text x="278" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Sticky Monorepo</text>
        <text x="278" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">repo state + queue</text>

        <!-- Node 3: Cursor Cloud Agent (focal, coral) -->
        <rect x="396" y="88" width="160" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="396" y="88" width="160" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <rect x="404" y="94" width="38" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
        <text x="423" y="103" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="476" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cursor Cloud Agent</text>
        <text x="476" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">claude-sonnet-5</text>

        <!-- Node 4: Real Tool (backend) -->
        <rect x="604" y="88" width="140" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="604" y="88" width="140" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="612" y="94" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="630" y="103" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TOOL</text>
        <text x="674" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Real Tool</text>
        <text x="674" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">npm/pip install + run</text>

        <!-- Node 5: HTML Artifact (store) -->
        <rect x="792" y="88" width="140" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="792" y="88" width="140" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="800" y="94" width="36" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
        <text x="818" y="103" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTML</text>
        <text x="862" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTML Artifact</text>
        <text x="862" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">output/*.html</text>

        <!-- Node 6: Pull Request (external) -->
        <rect x="980" y="88" width="144" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="980" y="88" width="144" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="988" y="94" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="1002" y="103" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PR</text>
        <text x="1052" y="138" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pull Request</text>
        <text x="1052" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">screenshot + video</text>

        <!-- Legend strip -->
        <line x1="40" y1="260" x2="1124" y2="260" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="276" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="292" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
        <text x="60" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal agent</text>

        <rect x="190" y="292" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="210" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Installed tool</text>

        <rect x="350" y="292" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="370" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Repo / artifact</text>

        <rect x="500" y="292" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="520" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External (PR)</text>

        <rect x="650" y="292" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="670" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Human source</text>

        <line x1="800" y1="297" x2="828" y2="297" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="836" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

        <line x1="960" y1="297" x2="988" y2="297" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="996" y="300" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Evidence link</text>
      </svg>
    </div>
  </div>
</body>
</html>
