<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Lumen Desk — HyperFrames output</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0b0c0a;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: radial-gradient(ellipse 70% 55% at 50% 38%, #1a140c 0%, #0b0c0a 68%);
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: Inter, Arial, Helvetica, sans-serif;
      }
      #glow {
        background: radial-gradient(circle at 50% 42%, rgba(232, 160, 74, 0.45), transparent 42%);
        opacity: 0;
      }
      #lamp {
        opacity: 0;
      }
      #lamp::after {
        content: "";
        width: 88px;
        height: 88px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #ffe2b0, #e8a04a 55%, #8a5318 100%);
        box-shadow: 0 0 60px rgba(232, 160, 74, 0.55);
      }
      #brand {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #f6f1e8;
        opacity: 0;
        white-space: nowrap;
      }
      #tagline {
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: rgba(246, 241, 232, 0.82);
        opacity: 0;
        white-space: nowrap;
        /* sit slightly under brand center */
        padding-top: 140px;
        align-content: center;
      }
      #cta {
        opacity: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #0b0c0a;
        width: max-content;
        height: max-content;
        max-width: 90%;
        inset: 0;
        margin: auto;
        padding: 0.7rem 1.4rem;
        border-radius: 999px;
        background: #e8a04a;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="lumen-desk"
      data-start="0"
      data-width="1280"
      data-height="720"
      data-duration="6"
      data-fps="30"
    >
      <div id="glow" class="clip" data-start="0" data-duration="6" data-track-index="0"></div>
      <div id="lamp" class="clip" data-start="0" data-duration="2.2" data-track-index="1"></div>
      <div id="brand" class="clip" data-start="1.2" data-duration="3.2" data-track-index="2">
        LUMEN DESK
      </div>
      <div id="tagline" class="clip" data-start="2.4" data-duration="2.4" data-track-index="3">
        Light that stays with you
      </div>
      <div id="cta" class="clip" data-start="4.4" data-duration="1.6" data-track-index="4">
        Shop the lamp
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to("#glow", { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo(
        "#lamp",
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
        0.15,
      );
      tl.to("#lamp", { opacity: 0, scale: 1.15, duration: 0.45, ease: "power1.in" }, 1.7);
      tl.fromTo(
        "#brand",
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" },
        1.25,
      );
      tl.fromTo(
        "#tagline",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        2.45,
      );
      tl.to(["#brand", "#tagline"], { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.2);
      tl.fromTo(
        "#cta",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.45, ease: "power2.out" },
        4.45,
      );
      tl.to("#cta", { opacity: 0, duration: 0.35, ease: "power1.in" }, 5.65);
      window.__timelines = window.__timelines || {};
      window.__timelines["lumen-desk"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
