<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>HyperFrames Title Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #stage {
        position: relative;
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: #0a0a0a;
      }
      .clip {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #title {
        font-family: Inter, sans-serif;
        font-size: 160px;
        font-weight: 800;
        color: #fff;
        opacity: 0;
        letter-spacing: -0.04em;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="title-card"
      data-start="0"
      data-width="1280"
      data-height="720"
      data-duration="3"
      data-fps="30"
    >
      <div id="title" class="clip" data-start="0" data-duration="3" data-track-index="0">
        HELLO
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // fade in 0–0.5s, hold to 2.5s, fade out by 3s — same curve as Remotion frames 0/15/75/90
      tl.to("#title", { opacity: 1, duration: 0.5, ease: "none" }, 0);
      tl.to("#title", { opacity: 1, duration: 2.0, ease: "none" }, 0.5);
      tl.to("#title", { opacity: 0, duration: 0.5, ease: "none" }, 2.5);
      window.__timelines = window.__timelines || {};
      window.__timelines["title-card"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
